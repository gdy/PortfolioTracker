# Saves GitHub's 14-day traffic numbers into a permanent history every day.
# See .github/scripts/traffic-stats.mjs for what is recorded; the report is the
# README.md on the traffic-stats branch.
#
# One-time setup: the built-in GITHUB_TOKEN cannot read traffic, so this needs a
# fine-grained personal access token stored as the TRAFFIC_TOKEN secret:
#   GitHub > Settings > Developer settings > Fine-grained tokens > Generate:
#   Repository access: only gdy/PortfolioTracker
#   Permissions: Administration -> Read-only (traffic lives under it)
# then add it under the repo's Settings > Secrets and variables > Actions.
name: Traffic stats

on:
  schedule:
    - cron: '17 6 * * *'   # daily, 06:17 UTC; off the hour to avoid the queue rush
  workflow_dispatch:         # "Run workflow" button for an on-demand update

permissions:
  contents: write            # to commit to the traffic-stats branch

concurrency:
  group: traffic-stats
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the traffic-stats branch (created on the first run)
        run: |
          if git fetch --depth=1 origin traffic-stats:traffic-stats; then
            git worktree add stats traffic-stats
          else
            git worktree add --detach stats HEAD
            git -C stats checkout --orphan traffic-stats
            git -C stats rm -rfq .
          fi

      - name: Record traffic
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/traffic-stats.mjs stats

      - name: Commit if anything changed
        working-directory: stats
        run: |
          git add history.json README.md
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Traffic stats for $(date -u +%F)"
          git push origin traffic-stats
